apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbrain-api
  namespace: openbrain
  labels:
    app: openbrain-api
    component: api
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: openbrain-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: openbrain-api
        component: api
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: openbrain-api
        # Published by CI on every push to master (.github/workflows/ci.yml) and
        # public, so no pull secret is needed for it. Tagged with the commit SHA
        # rather than :latest, so a pod's image says exactly which build it is and
        # a rollback is `kubectl rollout undo`.
        image: ghcr.io/srnichols/openbrain/api:6dbc24e547eb6c42aee54f6620578a6365190f12
        imagePullPolicy: Always
        ports:
        - name: api
          containerPort: 8000
          protocol: TCP
        - name: mcp
          containerPort: 8080
          protocol: TCP
        env:
        # Database
        - name: DB_HOST
          value: "openbrain-postgres.openbrain.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "openbrain"
        - name: DB_USER
          value: "openbrain"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: openbrain-secrets
              key: postgres-password

        # Ollama (cross-namespace, using existing Ollama deployment)
        - name: OLLAMA_ENDPOINT
          value: "http://ollama-gpu-bridge.your-namespace.svc.cluster.local:11434"
        - name: OLLAMA_EMBED_MODEL
          value: "nomic-embed-text"
        - name: OLLAMA_LLM_MODEL
          value: "llama3.2"
        - name: EMBEDDING_DIMENSIONS
          value: "768"

        # Embedder provider: "ollama" (local) or "openrouter" (cloud)
        - name: EMBEDDER_PROVIDER
          value: "ollama"

        # MCP Authentication
        # Shared fallback key. Per-client keys live in the access_keys table —
        # mint them with `npm run key -- mint --label <name>`.
        - name: MCP_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: openbrain-secrets
              key: mcp-access-key
        # Only for clients that cannot send the x-brain-key header — the URL form
        # puts the key into every access and proxy log. True here for backward
        # compatibility with clients configured before 0.8.0; turning it off is a
        # separate change, once request logging shows nobody depends on it.
        - name: MCP_ALLOW_KEY_IN_QUERY
          value: "true"

        # Application
        - name: API_HOST
          value: "0.0.0.0"
        - name: API_PORT
          value: "8000"
        - name: MCP_HOST
          value: "0.0.0.0"
        - name: MCP_PORT
          value: "8080"
        - name: LOG_LEVEL
          value: "info"
        # Set live but previously missing here, which meant this file could not
        # reproduce the running deployment.
        - name: OPENBRAIN_STRICT_INGEST
          value: "true"

        # Optional: OpenRouter (if EMBEDDER_PROVIDER=openrouter)
        # - name: OPENROUTER_API_KEY
        #   valueFrom:
        #     secretKeyRef:
        #       name: openbrain-secrets
        #       key: openrouter-api-key

        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3

        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - openbrain-api
              topologyKey: kubernetes.io/hostname

      # Not needed by the GHCR image above, which is public. Kept because the
      # previous ReplicaSet still references a private ACR tag, and removing this
      # would leave `kubectl rollout undo` unable to pull.
      imagePullSecrets:
      - name: acr-pull-secret
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: openbrain-api
  namespace: openbrain
  labels:
    app: openbrain-api
spec:
  type: ClusterIP
  ports:
  - name: api
    port: 8000
    targetPort: 8000
    protocol: TCP
  - name: mcp
    port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: openbrain-api
